services:
  db:
    image: postgres:15
    env_file:
      - db.env
    environment:
      POSTGRES_DB: fintech_db
      POSTGRES_USER: fintech_user
      POSTGRES_PASSWORD: fintech123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech_user -d fintech_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    env_file:
      - db.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
